<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">

  <!-- Background intentionally transparent -->

  <!-- ── OUTER THIN BORDER ── -->
  <rect x="6" y="6" width="288" height="388" rx="4" ry="4"
        fill="none" stroke="#1a3a8a" stroke-width="2"/>

  <!-- ── FRAME BAND: top, bottom, left, right rectangles ── -->
  <!-- Top band -->
  <rect x="6" y="6"   width="288" height="58" rx="4" ry="4" fill="#1a3a8a"/>
  <!-- Bottom band -->
  <rect x="6" y="336" width="288" height="58" rx="4" ry="4" fill="#1a3a8a"/>
  <!-- Left band -->
  <rect x="6" y="6"   width="52"  height="388" rx="4" ry="4" fill="#1a3a8a"/>
  <!-- Right band -->
  <rect x="242" y="6" width="52"  height="388" rx="4" ry="4" fill="#1a3a8a"/>

  <!-- Inner area transparent — tile background shows through -->
  <rect x="58" y="64" width="184" height="272" fill="none"/>

  <!-- ── INNER BORDER LINE ── -->
  <rect x="58" y="64" width="184" height="272"
        fill="none" stroke="#1a3a8a" stroke-width="1.5"/>

  <!-- ── CORNER ORNAMENTS (4 corners) ── -->
  <!-- Each corner: a cross-like floral piece in the frame band intersection -->

  <!-- Top-left corner ornament -->
  <g transform="translate(32,35)">
    <circle cx="0" cy="0" r="10" fill="#F4F0E6"/>
    <circle cx="0" cy="0" r="6"  fill="none" stroke="#F4F0E6" stroke-width="2"/>
    <line x1="-14" y1="0"  x2="14" y2="0"  stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0"  y1="-14" x2="0"  y2="14" stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0"   cy="-14" r="3.5" fill="#F4F0E6"/>
    <circle cx="0"   cy="14"  r="3.5" fill="#F4F0E6"/>
    <circle cx="-14" cy="0"   r="3.5" fill="#F4F0E6"/>
    <circle cx="14"  cy="0"   r="3.5" fill="#F4F0E6"/>
  </g>

  <!-- Top-right corner ornament -->
  <g transform="translate(268,35)">
    <circle cx="0" cy="0" r="10" fill="#F4F0E6"/>
    <line x1="-14" y1="0"  x2="14" y2="0"  stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0"  y1="-14" x2="0"  y2="14" stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0"   cy="-14" r="3.5" fill="#F4F0E6"/>
    <circle cx="0"   cy="14"  r="3.5" fill="#F4F0E6"/>
    <circle cx="-14" cy="0"   r="3.5" fill="#F4F0E6"/>
    <circle cx="14"  cy="0"   r="3.5" fill="#F4F0E6"/>
  </g>

  <!-- Bottom-left corner ornament -->
  <g transform="translate(32,365)">
    <circle cx="0" cy="0" r="10" fill="#F4F0E6"/>
    <line x1="-14" y1="0"  x2="14" y2="0"  stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0"  y1="-14" x2="0"  y2="14" stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0"   cy="-14" r="3.5" fill="#F4F0E6"/>
    <circle cx="0"   cy="14"  r="3.5" fill="#F4F0E6"/>
    <circle cx="-14" cy="0"   r="3.5" fill="#F4F0E6"/>
    <circle cx="14"  cy="0"   r="3.5" fill="#F4F0E6"/>
  </g>

  <!-- Bottom-right corner ornament -->
  <g transform="translate(268,365)">
    <circle cx="0" cy="0" r="10" fill="#F4F0E6"/>
    <line x1="-14" y1="0"  x2="14" y2="0"  stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0"  y1="-14" x2="0"  y2="14" stroke="#F4F0E6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0"   cy="-14" r="3.5" fill="#F4F0E6"/>
    <circle cx="0"   cy="14"  r="3.5" fill="#F4F0E6"/>
    <circle cx="-14" cy="0"   r="3.5" fill="#F4F0E6"/>
    <circle cx="14"  cy="0"   r="3.5" fill="#F4F0E6"/>
  </g>

  <!-- ── MID-SIDE ORNAMENTS ── -->
  <!-- Top mid -->
  <g transform="translate(150,35)">
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#F4F0E6" opacity="0.25"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#F4F0E6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-16" cy="0" r="3" fill="#F4F0E6"/>
    <circle cx="16"  cy="0" r="3" fill="#F4F0E6"/>
    <circle cx="0"   cy="0" r="5" fill="#F4F0E6"/>
  </g>
  <!-- Bottom mid -->
  <g transform="translate(150,365)">
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#F4F0E6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-16" cy="0" r="3" fill="#F4F0E6"/>
    <circle cx="16"  cy="0" r="3" fill="#F4F0E6"/>
    <circle cx="0"   cy="0" r="5" fill="#F4F0E6"/>
  </g>
  <!-- Left mid -->
  <g transform="translate(32,200)">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#F4F0E6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-16" r="3" fill="#F4F0E6"/>
    <circle cx="0" cy="16"  r="3" fill="#F4F0E6"/>
    <circle cx="0" cy="0"   r="5" fill="#F4F0E6"/>
  </g>
  <!-- Right mid -->
  <g transform="translate(268,200)">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#F4F0E6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-16" r="3" fill="#F4F0E6"/>
    <circle cx="0" cy="16"  r="3" fill="#F4F0E6"/>
    <circle cx="0" cy="0"   r="5" fill="#F4F0E6"/>
  </g>

  <!-- ── DECORATIVE CHAIN LINKS along frame sides ── -->
  <!-- Top band chain: small oval links between corner and mid ornaments -->
  <g fill="none" stroke="#F4F0E6" stroke-width="1.5" opacity="0.6">
    <!-- Top left section -->
    <ellipse cx="78"  cy="35" rx="8" ry="5"/>
    <ellipse cx="98"  cy="35" rx="8" ry="5"/>
    <ellipse cx="118" cy="35" rx="8" ry="5"/>
    <!-- Top right section -->
    <ellipse cx="182" cy="35" rx="8" ry="5"/>
    <ellipse cx="202" cy="35" rx="8" ry="5"/>
    <ellipse cx="222" cy="35" rx="8" ry="5"/>
    <!-- Bottom left section -->
    <ellipse cx="78"  cy="365" rx="8" ry="5"/>
    <ellipse cx="98"  cy="365" rx="8" ry="5"/>
    <ellipse cx="118" cy="365" rx="8" ry="5"/>
    <!-- Bottom right section -->
    <ellipse cx="182" cy="365" rx="8" ry="5"/>
    <ellipse cx="202" cy="365" rx="8" ry="5"/>
    <ellipse cx="222" cy="365" rx="8" ry="5"/>
  </g>
  <!-- Left band chain -->
  <g fill="none" stroke="#F4F0E6" stroke-width="1.5" opacity="0.6">
    <ellipse cx="32" cy="90"  rx="5" ry="8"/>
    <ellipse cx="32" cy="110" rx="5" ry="8"/>
    <ellipse cx="32" cy="130" rx="5" ry="8"/>
    <ellipse cx="32" cy="150" rx="5" ry="8"/>
    <ellipse cx="32" cy="170" rx="5" ry="8"/>
    <ellipse cx="32" cy="232" rx="5" ry="8"/>
    <ellipse cx="32" cy="252" rx="5" ry="8"/>
    <ellipse cx="32" cy="272" rx="5" ry="8"/>
    <ellipse cx="32" cy="292" rx="5" ry="8"/>
    <ellipse cx="32" cy="312" rx="5" ry="8"/>
  </g>
  <!-- Right band chain -->
  <g fill="none" stroke="#F4F0E6" stroke-width="1.5" opacity="0.6">
    <ellipse cx="268" cy="90"  rx="5" ry="8"/>
    <ellipse cx="268" cy="110" rx="5" ry="8"/>
    <ellipse cx="268" cy="130" rx="5" ry="8"/>
    <ellipse cx="268" cy="150" rx="5" ry="8"/>
    <ellipse cx="268" cy="170" rx="5" ry="8"/>
    <ellipse cx="268" cy="232" rx="5" ry="8"/>
    <ellipse cx="268" cy="252" rx="5" ry="8"/>
    <ellipse cx="268" cy="272" rx="5" ry="8"/>
    <ellipse cx="268" cy="292" rx="5" ry="8"/>
    <ellipse cx="268" cy="312" rx="5" ry="8"/>
  </g>

</svg>
