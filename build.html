<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Build a Hand — Mary on Mahjong</title>
    <link rel="stylesheet" href="css/shared.css">
    <style>
        /* ── Page structure ── */
        html, body { height: 100%; overflow: hidden; }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
        }

        #scrollContent {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px 0 12px;
            /* bottom padding computed in JS / kept generous */
            padding-bottom: var(--picker-clearance, 280px);
        }

        /* ── Pattern card ── */
        #patternCard {
            background: white;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .pattern-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }

        .pattern-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .pattern-meta {
            font-size: 12px;
            color: var(--color-text-secondary);
            white-space: nowrap;
        }

        .pattern-description {
            font-size: 14px;
            line-height: 1.55;
            margin-top: 5px;
            word-break: break-word;
        }

        /* ── Instruction box ── */
        #instructionBox {
            background: var(--color-primary-light);
            border: 1px solid rgba(44,95,45,0.2);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 10px;
            line-height: 1.45;
        }

        /* ── Bottom bar multi-button layout ── */
        .page-bottom-bar {
            flex-direction: column;
            gap: 6px;
        }
        .bar-top-row {
            width: 100%;
        }
        .bar-top-row .bar-action-btn {
            width: 100%;
        }
        .bar-bottom-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }
        .bar-bottom-row button {
            flex: 1;
        }
        .bar-secondary-btn {
            background: var(--color-bg-subtle);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .bar-secondary-btn:hover { background: var(--color-border); }

        /* Try Again — always visible */
        #tryAgainBtn { display: inline-block; }

        /* ── Result banner ── */
        #resultBanner {
            border-radius: 8px;
            padding: 9px 12px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            margin-bottom: 8px;
            display: none;
        }
        #resultBanner.valid {
            display: block;
            background: var(--color-success-light);
            color: var(--color-success);
            border: 1px solid var(--color-success);
        }
        #resultBanner.invalid {
            display: block;
            background: var(--color-error-light);
            color: var(--color-error);
            border: 1px solid var(--color-error);
        }

        /* ── Hand rack ── */
        #rackSection {
            margin-bottom: 6px;
        }

        .rack-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-muted);
            margin-bottom: 5px;
        }

        #rackContainer {
            background: var(--color-table);
            border-radius: 10px;
            padding: 8px 10px;
            min-height: 64px;
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            align-items: center;
        }

        .rack-tile {
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            touch-action: manipulation;
        }
        .rack-tile:active { transform: scale(0.88); }

        .rack-tile.wrong {
            outline: 2px solid var(--color-error);
            background: var(--color-error-light) !important;
        }
        .rack-tile::after {
            content: '×';
            position: absolute;
            top: 1px;
            right: 2px;
            font-size: 9px;
            color: rgba(0,0,0,0.35);
            line-height: 1;
            font-weight: 700;
        }

        .rack-slot-empty {
            width: clamp(30px, 3.5vw, 50px);
            height: clamp(38px, 4.5vw, 64px);
            border: 2px dashed rgba(0,0,0,0.15);
            border-radius: 6px;
            background: rgba(255,255,255,0.4);
            flex-shrink: 0;
        }

        /* ── Tile picker ── */
        #tilePicker {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.97);
            border-top: 1px solid var(--color-border);
            padding: 6px 8px 4px 8px;
            padding-bottom: max(4px, calc(env(safe-area-inset-bottom) - 52px));
            z-index: 150;
            backdrop-filter: blur(4px);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            /* sits above the page-bottom-bar */
            /* dynamically pushed up in JS */
        }

        .picker-row {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-bottom: 3px;
        }
        .picker-row:last-child { margin-bottom: 0; }

        .picker-tile {
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, opacity 0.15s;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .picker-tile:active { transform: scale(0.86); }

        .picker-tile.at-limit  { opacity: 0.3; }
        .picker-tile.rack-full { opacity: 0.3; pointer-events: none; }
        .picker-tile.joker-disabled { opacity: 0.2; pointer-events: none; }

        /* Picker tiles must fit 9 across — override shared.css clamp sizes */
        #tilePicker .tile {
            width: 40px;
            height: 52px;
            margin: 0;
        }
        #tilePicker .tile-number { font-size: 15px; }
        #tilePicker .tile-label  { font-size: 7px; }

        @media (max-width: 380px) {
            #tilePicker .tile { width: 34px; height: 44px; }
            #tilePicker .tile-number { font-size: 13px; }
        }

        .tile-count-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--color-primary);
            color: white;
            border-radius: 50%;
            width: 13px;
            height: 13px;
            font-size: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* ── Bottom bar override: sits below picker ── */
        /* page-bottom-bar from shared.css is already fixed bottom:0.
           We push the picker above it via JS after measuring. */

        /* ── Portrait tweaks ── */
        @media (orientation: portrait) and (max-width: 600px) {
            .rack-slot-empty {
                width: 36px;
                height: 46px;
            }
        }

        /* ── Desktop ── */
        @media (min-width: 700px) {
            #scrollContent {
                max-width: 680px;
                margin: 0 auto;
                width: 100%;
            }
            /* On desktop picker and bottom bar can be narrower */
            #tilePicker, .page-bottom-bar {
                max-width: 680px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: 680px;
                border-radius: 0 0 10px 10px;
            }
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ── Header ── -->
    <header class="page-header">
        <div>
            <h1>Build a Hand</h1>
        </div>
        <div class="header-right">
            <select class="header-card-select" id="cardSelect"></select>
            <a href="index.html" class="back-link">← Home</a>
        </div>
    </header>

    <!-- ── Scrollable content ── -->
    <div id="scrollContent">

        <!-- Instruction box -->
        <div id="instructionBox"></div>

        <!-- Pattern card -->
        <div id="patternCard">
            <div class="pattern-header-row">
                <span class="pattern-title" id="patternTitle">Loading…</span>
                <span class="pattern-meta" id="patternMeta"></span>
            </div>
            <div class="pattern-description" id="patternDescription"></div>
        </div>

        <!-- Result banner -->
        <div id="resultBanner"></div>

        <!-- Hand rack -->
        <div id="rackSection">
            <div class="rack-label">Your Hand &nbsp;<span id="tileCountLabel" style="font-weight:400;color:var(--color-text-secondary)"></span></div>
            <div id="rackContainer"></div>
        </div>

    </div><!-- end scrollContent -->

    <!-- ── Tile picker (fixed, above bottom bar) ── -->
    <div id="tilePicker">
        <div class="picker-row" id="rowBam"></div>
        <div class="picker-row" id="rowCrak"></div>
        <div class="picker-row" id="rowDot"></div>
        <div class="picker-row" id="rowHonors"></div>
    </div>

    <!-- ── Bottom bar ── -->
    <div class="page-bottom-bar">
        <div class="bar-top-row">
            <button class="bar-action-btn" id="validateBtn">Validate</button>
        </div>
        <div class="bar-bottom-row">
            <button class="bar-action-btn" id="tryAgainBtn">Try Again</button>
            <button class="bar-secondary-btn" id="newPatternBtn">New Pattern ↻</button>
        </div>
    </div>

</div><!-- end #app -->

<!-- Card data files — adjust paths to match your deployment -->
<script src="js/card-loader.js"></script>
<script src="js/patterns.js"></script>
<script>
// ════════════════════════════════════════════════════════════
//  build.html — Build a Hand
//  Depends on: shared.css, card-loader.js, patterns.js
// ════════════════════════════════════════════════════════════

'use strict';

// ── State ────────────────────────────────────────────────────
let currentPattern   = null;   // current card hand object
let currentHand      = [];     // array of tile-id strings in rack
let patternTileCount = 0;      // total tiles required by current pattern
let hasQuints        = false;  // whether pattern contains a quint group

// ── Tile definitions ─────────────────────────────────────────
const HONOR_TILES = ['N', 'E', 'W', 'S', 'F', 'GD', 'RD', 'WD', 'J'];

// Per-hand tile limit (not cross-hand)
function tileLimit(tile) {
    return (tile === 'J' || tile === 'F') ? 8 : 4;
}

// ── Tile display — uses shared.css classes ────────────────────
function tileInfo(tile) {
    if (tile === 'GD') return { number: 'G', label: 'Green',  cls: 'tile-GD'   };
    if (tile === 'RD') return { number: 'R', label: 'Red',    cls: 'tile-RD'   };
    if (tile === 'WD') return { number: 'O', label: 'White',  cls: 'tile-WD'   };
    if (tile === 'F')  return { number: 'F', label: 'Flower', cls: 'tile-F'    };
    if (tile === 'J')  return { number: 'J', label: 'Joker',  cls: 'tile-J'    };
    if (tile === 'N')  return { number: 'N', label: 'North',  cls: 'tile-WIND' };
    if (tile === 'E')  return { number: 'E', label: 'East',   cls: 'tile-WIND' };
    if (tile === 'W')  return { number: 'W', label: 'West',   cls: 'tile-WIND' };
    if (tile === 'S')  return { number: 'S', label: 'South',  cls: 'tile-WIND' };
    if (tile.length === 2 && tile[1] === 'B') return { number: tile[0], label: 'Bam',   cls: 'tile-B' };
    if (tile.length === 2 && tile[1] === 'C') return { number: tile[0], label: 'Crack', cls: 'tile-C' };
    if (tile.length === 2 && tile[1] === 'D') return { number: tile[0], label: 'Dot',   cls: 'tile-D' };
    return { number: tile, label: '', cls: '' };
}

function buildTileEl(tile, extraClass = '') {
    const { number, label, cls } = tileInfo(tile);
    const div = document.createElement('div');
    div.className = ['tile', cls, extraClass].filter(Boolean).join(' ');
    const numDiv = document.createElement('div');
    numDiv.className = 'tile-number';
    numDiv.textContent = number;
    const lblDiv = document.createElement('div');
    lblDiv.className = 'tile-label';
    lblDiv.textContent = label;
    div.appendChild(numDiv);
    div.appendChild(lblDiv);
    return div;
}

function renderInstructionBox() {
    const year = window.ACTIVE_CARD_YEAR || '';
    const label = year ? `NMJL ${year}` : 'current';
    document.getElementById('instructionBox').textContent =
        `Get to know the ${label} card hands by seeing them for yourself. ` +
        `Use the tiles below to make a hand, and validate it to be sure you've got it right.`;
}
function loadPattern(pattern) {
    currentPattern   = pattern;
    currentHand      = [];

    // Tile count from parsed groups
    let groups = [];
    try {
        groups = parsePattern(pattern.code);
    } catch (e) {
        console.error('parsePattern error:', e);
    }
    patternTileCount = groups.reduce((sum, g) => sum + g.tiles.length, 0);

    // Quints: group of 5 identical tiles (requires joker — only 4 naturals exist)
    hasQuints = groups.some(g =>
        g.tiles.length >= 5 && g.tiles.every(t => t === g.tiles[0])
    );

    renderInstructionBox();
    renderPatternCard();
    renderRack();
    updatePickerBadges();
    hideResult();
    updateHint();
}

function renderPatternCard() {
    const p = currentPattern;

    document.getElementById('patternTitle').textContent =
        `${p.Section}  ·  Hand ${p['hand number']}`;

    const closed = (p.status || '').toLowerCase() === 'closed';
    document.getElementById('patternMeta').textContent =
        `${p.points} pts · ${closed ? 'Closed' : 'Open'}`;

    const descEl = document.getElementById('patternDescription');
    descEl.innerHTML = '';
    if (Array.isArray(p.description)) {
        p.description.forEach(span => {
            const s = document.createElement('span');
            s.textContent = span.text;
            s.style.color = span.color || 'inherit';
            if (span.bold) s.style.fontWeight = '700';
            descEl.appendChild(s);
        });
    } else if (typeof p.description === 'string') {
        descEl.textContent = p.description;
    }
}

// ── Hand rack ────────────────────────────────────────────────
function renderRack() {
    const rack = document.getElementById('rackContainer');
    rack.innerHTML = '';

    // Placed tiles
    currentHand.forEach((tile, idx) => {
        const el = buildTileEl(tile, 'rack-tile');
        el.title = 'Tap to remove';
        el.addEventListener('click', () => removeTile(idx));
        rack.appendChild(el);
    });

    // Empty slots
    const remaining = patternTileCount - currentHand.length;
    for (let i = 0; i < remaining; i++) {
        const slot = document.createElement('div');
        slot.className = 'rack-slot-empty';
        rack.appendChild(slot);
    }

    document.getElementById('tileCountLabel').textContent =
        `(${currentHand.length} / ${patternTileCount})`;
}

function removeTile(idx) {
    currentHand.splice(idx, 1);
    renderRack();
    updatePickerBadges();
    hideResult();
    updateHint();
}

// ── Tile picker ──────────────────────────────────────────────
function buildPicker() {
    const rows = {
        rowBam:    Array.from({length: 9}, (_, i) => `${i+1}B`),
        rowCrak:   Array.from({length: 9}, (_, i) => `${i+1}C`),
        rowDot:    Array.from({length: 9}, (_, i) => `${i+1}D`),
        rowHonors: HONOR_TILES,
    };

    Object.entries(rows).forEach(([rowId, tiles]) => {
        const row = document.getElementById(rowId);
        row.innerHTML = '';
        tiles.forEach(tile => row.appendChild(makePickerTile(tile)));
    });
}

function makePickerTile(tile) {
    const el = buildTileEl(tile, 'picker-tile');
    el.dataset.tile = tile;
    el.addEventListener('click', () => onPickerClick(tile));
    return el;
}

function onPickerClick(tile) {
    // Rack full
    if (currentHand.length >= patternTileCount) return;
    // Tile limit
    const count = currentHand.filter(t => t === tile).length;
    if (count >= tileLimit(tile)) return;
    // Jokers only when pattern needs them
    if (tile === 'J' && !hasQuints) return;

    currentHand.push(tile);
    renderRack();
    updatePickerBadges();
    hideResult();
    updateHint();
}

function updatePickerBadges() {
    const rackFull = currentHand.length >= patternTileCount;

    document.querySelectorAll('.picker-tile').forEach(el => {
        const tile  = el.dataset.tile;
        const count = currentHand.filter(t => t === tile).length;
        const limit = tileLimit(tile);
        const atLim = count >= limit;

        // Badge
        let badge = el.querySelector('.tile-count-badge');
        if (count > 0) {
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'tile-count-badge';
                el.appendChild(badge);
            }
            badge.textContent = count;
        } else if (badge) {
            badge.remove();
        }

        // State classes
        el.classList.toggle('at-limit',      atLim && !rackFull);
        el.classList.toggle('rack-full',     rackFull);
        el.classList.toggle('joker-disabled', tile === 'J' && !hasQuints);
    });
}

// ── Validation ───────────────────────────────────────────────
function validateHand() {
    if (!currentPattern) return;

    if (currentHand.length !== patternTileCount) {
        const diff = patternTileCount - currentHand.length;
        showResult('invalid',
            diff > 0
                ? `✗  Need ${diff} more tile${diff === 1 ? '' : 's'}.`
                : `✗  Too many tiles — remove ${-diff}.`
        );
        return;
    }

    let results;
    try {
        results = evaluatePattern(currentHand, currentPattern.code);
    } catch (e) {
        showResult('invalid', '✗  Error evaluating hand.');
        console.error(e);
        return;
    }

    if (!results || results.length === 0) {
        showResult('invalid', '✗  No match found for this pattern.');
        return;
    }

    const best = results[0];
    const missing = best.groups.reduce(
        (sum, g) => sum + g.matchedTiles.filter(t => t === '?').length, 0
    );

    if (missing === 0) {
        showResult('valid', '✓  Valid hand!');
    } else {
        // handPool = tiles the engine couldn't place.
        // Find which rack indices those correspond to by elimination.
        const unmatched = [...best.handPool]; // leftovers
        const wrongIndices = new Set();
        const handCopy = [...currentHand];
        unmatched.forEach(tile => {
            const idx = handCopy.indexOf(tile);
            if (idx !== -1) {
                wrongIndices.add(idx);
                handCopy[idx] = null; // consume it
            }
        });

        // Highlight wrong tiles in rack
        document.querySelectorAll('.rack-tile').forEach((el, i) => {
            el.classList.toggle('wrong', wrongIndices.has(i));
        });

        const count = wrongIndices.size || missing;
        const verb = count === 1 ? 'is' : 'are';
        showResult('invalid',
            `✗  ${count} tile${count === 1 ? '' : 's'} ${verb} wrong.`
        );
    }
}

// ── Result UI ────────────────────────────────────────────────
function showResult(type, msg) {
    const banner = document.getElementById('resultBanner');
    banner.className = type;   // 'valid' or 'invalid' — CSS handles display
    banner.textContent = msg;
    if (type !== 'valid') {
    }
}

function hideResult() {
    const banner = document.getElementById('resultBanner');
    banner.className = '';
    banner.style.display = '';
    // Clear any wrong-tile highlights
    document.querySelectorAll('.rack-tile.wrong').forEach(el => el.classList.remove('wrong'));
}

function updateHint() { /* hint text moved to bottom bar — no-op */ }

// ── New / Try Again ──────────────────────────────────────────
function newPattern() {
    if (typeof ACTIVE_CARD === 'undefined' || !ACTIVE_CARD || ACTIVE_CARD.length === 0) {
        document.getElementById('patternTitle').textContent = 'No card loaded';
        return;
    }
    const idx = Math.floor(Math.random() * ACTIVE_CARD.length);
    loadPattern(ACTIVE_CARD[idx]);
}

function tryAgain() {
    currentHand = [];
    renderRack();
    updatePickerBadges();
    hideResult();
    updateHint();
}

// ── Layout: push picker above bottom bar ─────────────────────
function positionPicker() {
    const bar    = document.querySelector('.page-bottom-bar');
    const picker = document.getElementById('tilePicker');
    if (!bar || !picker) return;
    const barH   = bar.getBoundingClientRect().height;
    picker.style.bottom = barH + 'px';

    // Set scroll content bottom padding
    const pickerH = picker.getBoundingClientRect().height;
    document.getElementById('scrollContent').style.paddingBottom =
        (barH + pickerH + 16) + 'px';
}

// ── Init ─────────────────────────────────────────────────────
document.getElementById('validateBtn').addEventListener('click', validateHand);
document.getElementById('tryAgainBtn').addEventListener('click', tryAgain);
document.getElementById('newPatternBtn').addEventListener('click', newPattern);

// Card selector — populateCardSelect wires its own change handler
populateCardSelect('cardSelect', function(year) {
    loadCard(year, newPattern);
});

// Load default card, then serve first pattern via callback
loadCard('2026', newPattern);

// Build picker
buildPicker();

// Position picker above bottom bar
requestAnimationFrame(() => {
    positionPicker();
    setTimeout(positionPicker, 200);
});
window.addEventListener('resize', positionPicker);
window.addEventListener('orientationchange', () => setTimeout(positionPicker, 300));
</script>
</body>
</html>
