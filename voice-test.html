<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Voice Browser — Mary on Mahjong</title>
    <style>
        :root {
            --green: #2c5f2d;
            --green-dark: #1f4420;
            --green-light: #f0f8f0;
            --green-mid: #e0efe0;
            --text: #222;
            --text-muted: #666;
            --border: #d0d8d0;
            --bg: #f7faf7;
            --white: #ffffff;
            --gold: #b8860b;
            --tile-bg: #fffde7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 40px;
        }

        header {
            background: var(--green);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        header .sub {
            font-size: 12px;
            opacity: 0.75;
            margin-top: 1px;
        }

        .tile-icon {
            font-size: 28px;
            line-height: 1;
        }

        .main {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ── Device info bar ── */
        .device-bar {
            background: var(--green-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .device-bar span { font-weight: 600; color: var(--text); }

        /* ── Control panel ── */
        .panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--green);
            margin-bottom: 12px;
        }

        .tiles-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .tile-btn {
            background: var(--tile-bg);
            border: 1px solid #e0d060;
            border-radius: 6px;
            padding: 5px 9px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
        }

        .tile-btn:hover { background: #fff9c4; transform: translateY(-1px); }
        .tile-btn.active { background: var(--green); color: white; border-color: var(--green-dark); }

        .custom-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .custom-row input[type=text] {
            flex: 1;
            min-width: 160px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
        }

        .custom-row input:focus {
            outline: none;
            border-color: var(--green);
        }

        /* ── Sliders ── */
        .sliders {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 180px;
        }

        .slider-group label {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 34px;
        }

        .slider-group input[type=range] {
            flex: 1;
            accent-color: var(--green);
        }

        .slider-group .val {
            font-size: 12px;
            font-weight: 600;
            min-width: 28px;
            color: var(--green-dark);
        }

        /* ── Filter pills ── */
        .filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .filter-btn {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--white);
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .filter-btn:hover { border-color: var(--green); color: var(--green); }
        .filter-btn.active { background: var(--green); color: white; border-color: var(--green-dark); }

        /* ── Voice count ── */
        .voice-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .voice-count strong { color: var(--green-dark); }

        /* ── Voice table ── */
        .table-wrap {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead tr {
            background: var(--green-light);
        }

        th {
            text-align: left;
            padding: 9px 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--green-dark);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid #eef2ee;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        tbody tr:hover td { background: var(--green-light); }

        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .badge-female { background: #fce4ec; color: #880e4f; }
        .badge-male   { background: #e3f2fd; color: #0d47a1; }
        .badge-local  { background: var(--green-light); color: var(--green-dark); }
        .badge-net    { background: #fff3e0; color: #e65100; }

        .play-btn {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 5px;
            border: 1px solid var(--green);
            background: var(--white);
            color: var(--green);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .play-btn:hover { background: var(--green); color: white; }
        .play-btn.speaking { background: var(--green); color: white; }

        .voice-name { font-weight: 500; }
        .voice-lang { color: var(--text-muted); font-size: 12px; }

        /* ── No voices message ── */
        .no-voices {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ── iOS unlock button ── */
        #unlockBtn {
            display: none;
            width: 100%;
            padding: 14px;
            background: var(--green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            th.hide-mobile, td.hide-mobile { display: none; }
            .tile-btn { font-size: 11px; padding: 4px 7px; }
        }
    </style>
</head>
<body>

<header>
    <div class="tile-icon">🀄</div>
    <div>
        <h1>Voice Browser</h1>
        <div class="sub">Mary on Mahjong — bot voice sampler</div>
    </div>
</header>

<div class="main">

    <div class="device-bar" id="deviceBar">
        Detecting device info...
    </div>

    <!-- iOS needs a user gesture first -->
    <button id="unlockBtn" onclick="unlockAudio()">Tap to enable speech (iOS)</button>

    <!-- Say panel -->
    <div class="panel">
        <div class="panel-title">What to say</div>

        <div class="tiles-grid" id="tileButtons"></div>

        <div class="custom-row">
            <input type="text" id="testText" value="One Bam" placeholder="Type anything..." />
            <button class="play-btn" onclick="speakCurrent()" style="padding:8px 18px; font-size:14px;">▶ Speak</button>
        </div>

        <div class="sliders">
            <div class="slider-group">
                <label>Rate</label>
                <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1"
                       oninput="document.getElementById('rateVal').textContent=parseFloat(this.value).toFixed(1)">
                <span class="val" id="rateVal">1.0</span>
            </div>
            <div class="slider-group">
                <label>Pitch</label>
                <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1"
                       oninput="document.getElementById('pitchVal').textContent=parseFloat(this.value).toFixed(1)">
                <span class="val" id="pitchVal">1.0</span>
            </div>
        </div>
    </div>

    <!-- Voice list panel -->
    <div class="panel">
        <div class="panel-title">Available voices on this device</div>

        <div class="filters" id="filterBtns">
            <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
            <button class="filter-btn" onclick="setFilter('en',this)">English</button>
            <button class="filter-btn" onclick="setFilter('en-US',this)">English (US)</button>
            <button class="filter-btn" onclick="setFilter('en-GB',this)">English (UK)</button>
            <button class="filter-btn" onclick="setFilter('en-AU',this)">English (AU)</button>
            <button class="filter-btn" onclick="setFilter('female',this)">Female</button>
            <button class="filter-btn" onclick="setFilter('male',this)">Male</button>
            <button class="filter-btn" onclick="setFilter('local',this)">Local only</button>
        </div>

        <div class="voice-count" id="voiceCount">Loading...</div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th class="hide-mobile">Language</th>
                        <th>Gender</th>
                        <th class="hide-mobile">Type</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="voiceBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // ── Tile quick-pick labels ──
    const TILE_PRESETS = [
        { label: 'One Bam',     text: 'One Bam' },
        { label: 'Two Bam',     text: 'Two Bam' },
        { label: 'Nine Bam',    text: 'Nine Bam' },
        { label: 'One Crak',    text: 'One Crak' },
        { label: 'Five Dot',    text: 'Five Dot' },
        { label: 'North',       text: 'North Wind' },
        { label: 'East',        text: 'East Wind' },
        { label: 'West',        text: 'West Wind' },
        { label: 'South',       text: 'South Wind' },
        { label: 'Green Dragon',text: 'Green Dragon' },
        { label: 'Red Dragon',  text: 'Red Dragon' },
        { label: 'White Dragon',text: 'White Dragon' },
        { label: 'Flower',      text: 'Flower' },
        { label: 'Joker',       text: 'Joker' },
        { label: 'Call',        text: 'Call' },
        { label: 'Mah Jong!',   text: 'Mah Jong' },
    ];

    let allVoices = [];
    let currentFilter = 'all';
    let speakingBtn = null;

    // ── Device info ──
    function detectDevice() {
        const ua = navigator.userAgent;
        const parts = [];
        if (/iPhone|iPad|iPod/.test(ua)) parts.push('<span>iOS</span>');
        else if (/Android/.test(ua)) parts.push('<span>Android</span>');
        else if (/Macintosh/.test(ua)) parts.push('<span>macOS</span>');
        else if (/Windows/.test(ua)) parts.push('<span>Windows</span>');
        if (/CriOS|Chrome/.test(ua) && !/Edg/.test(ua)) parts.push('<span>Chrome</span>');
        else if (/Edg/.test(ua)) parts.push('<span>Edge</span>');
        else if (/Firefox/.test(ua)) parts.push('<span>Firefox</span>');
        else if (/Safari/.test(ua)) parts.push('<span>Safari</span>');
        parts.push('speechSynthesis: ' + (typeof speechSynthesis !== 'undefined' ? '<span>supported</span>' : 'not supported'));
        document.getElementById('deviceBar').innerHTML = parts.join(' &nbsp;·&nbsp; ');

        // Show unlock button on iOS
        if (/iPhone|iPad|iPod/.test(ua)) {
            document.getElementById('unlockBtn').style.display = 'block';
        }
    }

    // ── iOS audio unlock ──
    function unlockAudio() {
        const u = new SpeechSynthesisUtterance('');
        speechSynthesis.speak(u);
        document.getElementById('unlockBtn').style.display = 'none';
        setTimeout(loadVoices, 300);
    }

    // ── Gender heuristic ──
    function genderHint(name) {
        const n = name.toLowerCase();
        const f = ['female','woman','zira','hazel','susan','kate','karen','victoria','moira','fiona',
                   'samantha','allison','ava','evelyn','nicky','aria','jenny','ana','libby','mia',
                   'natasha','helena','laura','linda','alice','clara','emma','amelie','marie','anna',
                   'catherine','serena','tessa','veena','paulina','mónica','lucia','carmit','yuna',
                   'kyoko','ting-ting','sin-ji','mei-jia'];
        const m = ['male','man','david','mark','fred','tom','daniel','james','lee','rishi','george',
                   'oliver','liam','ken','alex','aaron','gordon','bruce','arthur','eddy','ralph',
                   'reed','rocko','sandy','shelley','junior','bahh','bells','boing','bubbles',
                   'cellos','deranged','good','hysterical','zarvox'];
        if (f.some(w => n.includes(w))) return 'female';
        if (m.some(w => n.includes(w))) return 'male';
        return null;
    }

    // ── Build tile quick-pick buttons ──
    function buildTileButtons() {
        const grid = document.getElementById('tileButtons');
        TILE_PRESETS.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'tile-btn';
            btn.textContent = p.label;
            btn.onclick = () => {
                document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('testText').value = p.text;
            };
            grid.appendChild(btn);
        });
    }

    // ── Filter ──
    function setFilter(f, btn) {
        currentFilter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTable();
    }

    // ── Render table ──
    function renderTable() {
        const body = document.getElementById('voiceBody');
        body.innerHTML = '';

        const filtered = allVoices.filter(v => {
            if (currentFilter === 'en')     return v.lang.startsWith('en');
            if (currentFilter === 'en-US')  return v.lang === 'en-US' || v.lang === 'en_US';
            if (currentFilter === 'en-GB')  return v.lang === 'en-GB' || v.lang === 'en_GB';
            if (currentFilter === 'en-AU')  return v.lang === 'en-AU' || v.lang === 'en_AU';
            if (currentFilter === 'female') return genderHint(v.name) === 'female';
            if (currentFilter === 'male')   return genderHint(v.name) === 'male';
            if (currentFilter === 'local')  return v.localService;
            return true;
        });

        document.getElementById('voiceCount').innerHTML =
            '<strong>' + filtered.length + '</strong> voices shown of <strong>' + allVoices.length + '</strong> total on this device/browser';

        if (filtered.length === 0) {
            body.innerHTML = '<tr><td colspan="5"><div class="no-voices">No voices match this filter on this device.</div></td></tr>';
            return;
        }

        filtered.forEach(v => {
            const gh = genderHint(v.name);
            const tr = document.createElement('tr');

            const genderBadge = gh
                ? `<span class="badge badge-${gh}">${gh}</span>`
                : '<span style="color:#aaa; font-size:12px;">—</span>';

            const typeBadge = v.localService
                ? '<span class="badge badge-local">local</span>'
                : '<span class="badge badge-net">network</span>';

            tr.innerHTML = `
                <td><span class="voice-name">${v.name}</span></td>
                <td class="hide-mobile"><span class="voice-lang">${v.lang}</span></td>
                <td>${genderBadge}</td>
                <td class="hide-mobile">${typeBadge}</td>
                <td><button class="play-btn" data-idx="${allVoices.indexOf(v)}">▶ Play</button></td>
            `;

            tr.querySelector('.play-btn').addEventListener('click', function() {
                speakWith(parseInt(this.dataset.idx), this);
            });

            body.appendChild(tr);
        });
    }

    // ── Speak ──
    function speakWith(idx, btn) {
        const v = allVoices[idx];
        const text = document.getElementById('testText').value || 'One Bam';
        const rate  = parseFloat(document.getElementById('rateSlider').value);
        const pitch = parseFloat(document.getElementById('pitchSlider').value);

        speechSynthesis.cancel();

        if (speakingBtn) speakingBtn.classList.remove('speaking');
        speakingBtn = btn || null;
        if (speakingBtn) speakingBtn.classList.add('speaking');

        const u = new SpeechSynthesisUtterance(text);
        u.voice = v;
        u.rate  = rate;
        u.pitch = pitch;
        u.onend = () => { if (speakingBtn) speakingBtn.classList.remove('speaking'); speakingBtn = null; };
        speechSynthesis.speak(u);
    }

    function speakCurrent() {
        if (allVoices.length === 0) return;
        // Use first visible voice if none selected
        speakWith(allVoices.indexOf(
            allVoices.find(v => currentFilter === 'all' || v.lang.startsWith(currentFilter)) || allVoices[0]
        ), null);
    }

    // ── Load voices ──
    function loadVoices() {
        const v = speechSynthesis.getVoices();
        if (v.length === 0) return;
        allVoices = v;
        renderTable();
    }

    // ── Init ──
    detectDevice();
    buildTileButtons();

    if (typeof speechSynthesis !== 'undefined') {
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
        setTimeout(loadVoices, 600);
    } else {
        document.getElementById('voiceCount').textContent = 'Speech synthesis not supported on this browser.';
    }
</script>
</body>
</html>
