<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Joker Jackpot – Mary on Mahjong</title>
    <link rel="stylesheet" href="/Mahjong/css/shared.css">
    <style>
        /* ── Layout ── */
        .main {
            max-width: 520px;
            margin: 0 auto;
            padding: 20px 16px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .instructions {
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            color: #5d4037;
            line-height: 1.5;
            width: 100%;
        }

        /* ── Slot machine housing ── */
        .slot-machine {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .slot-housing {
            background: linear-gradient(160deg, #162e17 0%, #2c5f2d 55%, #162e17 100%);
            border: 3px solid #c9a84c;
            border-radius: 20px;
            padding: 18px 16px 18px;
            box-shadow:
                0 8px 28px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }

        .slot-title {
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 14px;
            text-shadow: 0 0 8px rgba(201,168,76,0.5), 0 1px 3px rgba(0,0,0,0.5);
        }

        /* ── Reels ── */
        .reels-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .reel-window {
            width: 66px;
            height: 82px;
            background: #0c1a0d;
            border: 2px solid #c9a84c;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow:
                inset 0 3px 10px rgba(0,0,0,0.6),
                inset 0 0 0 1px rgba(0,0,0,0.3);
            position: relative;
        }

        /* Sheen lines across reel windows */
        .reel-window::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        .reel-window.blank {
            opacity: 0.25;
        }

        .reel-window.bounce {
            animation: reelBounce 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes reelBounce {
            0%   { transform: scaleY(1.00); }
            20%  { transform: scaleY(1.10); }
            50%  { transform: scaleY(0.94); }
            75%  { transform: scaleY(1.04); }
            100% { transform: scaleY(1.00); }
        }

        /* Decorative lights below each reel */
        .reel-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3a3a3a;
            border: 1px solid #555;
            margin-top: 6px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .reel-light.lit {
            background: #c9a84c;
            box-shadow: 0 0 6px #c9a84c, 0 0 12px rgba(201,168,76,0.4);
        }

        .reel-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Tiles inside reels ── */
        .reel-window .tile {
            width: 46px;
            height: 58px;
            margin: 0;
            font-size: 18px;
            flex-shrink: 0;
        }
        .reel-window .tile-number { font-size: 18px; }
        .reel-window .tile-label  { font-size: 8px; }

        /* SVG tile inside reel */
        .trad-tile {
            position: relative;
            width: 46px;
            height: 58px;
            border-radius: 6px;
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.6);
            overflow: hidden;
            flex-shrink: 0;
        }
        .trad-tile img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* ── Tile style toggle ── */
        .tile-toggle {
            display: flex;
            border: 1.5px solid rgba(201,168,76,0.5);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 2px;
            align-self: center;
        }

        .tile-toggle button {
            padding: 5px 14px;
            border: none;
            background: transparent;
            color: rgba(201,168,76,0.6);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: background 0.15s, color 0.15s;
        }

        .tile-toggle button + button {
            border-left: 1.5px solid rgba(201,168,76,0.5);
        }

        .tile-toggle button.active {
            background: rgba(201,168,76,0.18);
            color: #c9a84c;
        }

        /* ── Action buttons (Bank / Spin) ── */
        .action-btns {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        .bank-display {
            font-size: 28px;
            font-weight: 900;
            color: var(--color-primary);
            letter-spacing: 0.02em;
            text-align: center;
        }

        .answer-btn {
            flex: 1;
            padding: 14px 10px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 0.02em;
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0,0,0,0.15);
        }

        .answer-btn:active:not(:disabled) { transform: translateY(0); }
        .answer-btn:disabled { opacity: 0.5; cursor: default; }

        .btn-bank {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #2e7d32;
        }

        .btn-spin-away {
            background: #f5f5f5;
            color: #555;
            border-color: #bbb;
        }

        /* ── Instruction box ── */
        .info-box {
            width: 100%;
            max-width: 420px;
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            color: #5d4037;
            line-height: 1.7;
        }

        .info-box strong { color: #2c5f2d; }

        /* ── Feedback ── */
        .feedback {
            width: 100%;
            max-width: 420px;
            display: none;
        }

        .feedback.visible { display: block; }

        .feedback-badge {
            display: block;
            width: 100%;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 14px;
            font-weight: 700;
        }

        .feedback-badge.earned {
            background: #f1f8f1;
            border: 2px solid #2e7d32;
            color: #1b5e20;
        }

        .feedback-badge.penalty {
            background: #fff5f5;
            border: 2px solid #c62828;
            color: #b71c1c;
        }

        .feedback-badge.missed {
            background: #fff8e1;
            border: 2px solid #f9a825;
            color: #5d4037;
        }

        /* ── End overlay ── */
        .end-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }

        .end-overlay.visible { display: flex; }

        .end-card {
            background: white;
            border-radius: 20px;
            padding: 36px 32px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .end-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .end-title.win  { color: #2c5f2d; }
        .end-title.lose { color: #c62828; }

        .end-subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .end-btn {
            background: var(--color-primary, #2c5f2d);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .end-btn:hover { background: #1f4420; }

        .jackpot-stars {
            font-size: 28px;
            margin-bottom: 8px;
            animation: starPop 0.6s ease-out;
        }

        @keyframes starPop {
            0%   { transform: scale(0.5); opacity: 0; }
            70%  { transform: scale(1.2); }
            100% { transform: scale(1.0); opacity: 1; }
        }
    </style>
</head>
<body>

<header class="page-header">
    <div>
        <h1>Joker Jackpot</h1>
        <div class="subtitle">Can you reach 500 coins?</div>
    </div>
    <div class="header-right">
       
        <a href="/Mahjong/index.html" class="back-link">← Home</a>
    </div>
</header>

<div class="main">

    <div class="info-box">
        Start: <strong>100 🪙</strong> · Goal: <strong>500 🪙</strong> · Spin costs: <strong>5 🪙</strong><br>
        Bank a legal group: pair <strong>+15</strong> · 3 tiles <strong>+25</strong> · 4 tiles <strong>+40</strong><br>
        Bank an illegal group: lose <strong>50%</strong> of your bank
    </div>

    <div class="slot-machine">
        <div class="slot-housing">
            <div class="slot-title">✦ Joker Jackpot ✦</div>
            <div class="reels-row" id="reelsRow">
                <div class="reel-wrap">
                    <div class="reel-window blank" id="reel0"></div>
                    <div class="reel-light" id="light0"></div>
                </div>
                <div class="reel-wrap">
                    <div class="reel-window blank" id="reel1"></div>
                    <div class="reel-light" id="light1"></div>
                </div>
                <div class="reel-wrap">
                    <div class="reel-window blank" id="reel2"></div>
                    <div class="reel-light" id="light2"></div>
                </div>
                <div class="reel-wrap">
                    <div class="reel-window blank" id="reel3"></div>
                    <div class="reel-light" id="light3"></div>
                </div>
            </div>
            <div class="tile-toggle" style="margin-top:12px;">
                <button id="btnText" class="active" onclick="setTileMode('text')">ABC</button>
                <button id="btnSvg" onclick="setTileMode('svg')">🀄 ART</button>
            </div>
        </div>

    </div>

    <div class="bank-display" id="bankDisplay">🪙 <span id="bankAmount">100</span></div>

    <div class="action-btns">
        <button class="answer-btn btn-bank"      id="btnBank"     onclick="doBank()" disabled>Bank it</button>
        <button class="answer-btn btn-spin-away" id="btnSpinAway" onclick="doSpin()">Spin (−5)</button>
    </div>

    <div class="feedback" id="feedback">
        <span class="feedback-badge" id="feedbackBadge"></span>
    </div>

</div>

<div class="end-overlay" id="endOverlay">
    <div class="end-card">
        <div class="jackpot-stars" id="endStars"></div>
        <div class="end-title" id="endTitle"></div>
        <div class="end-subtitle" id="endSubtitle"></div>
        <button class="end-btn" onclick="startGame()">Play Again</button>
    </div>
</div>

<script>
// ── Tile display helpers ──────────────────────────────────────────────────────

let tileMode = 'text'; // 'text' | 'svg'

function setTileMode(mode) {
    tileMode = mode;
    document.getElementById('btnText').classList.toggle('active', mode === 'text');
    document.getElementById('btnSvg').classList.toggle('active', mode === 'svg');
    if (gameState === 'landed' && currentScenario) {
        renderScenarioTiles(currentScenario);
    }
}

function getTileDisplay(tile) {
    if (tile === 'WD') return { number: 'O', label: 'White',  colorClass: 'tile-WD' };
    if (tile === 'GD') return { number: 'G', label: 'Green',  colorClass: 'tile-GD' };
    if (tile === 'RD') return { number: 'R', label: 'Red',    colorClass: 'tile-RD' };
    if (tile === 'N')  return { number: 'N', label: 'North',  colorClass: 'tile-WIND' };
    if (tile === 'E')  return { number: 'E', label: 'East',   colorClass: 'tile-WIND' };
    if (tile === 'W')  return { number: 'W', label: 'West',   colorClass: 'tile-WIND' };
    if (tile === 'S')  return { number: 'S', label: 'South',  colorClass: 'tile-WIND' };
    if (tile === 'F')  return { number: 'F', label: 'Flower', colorClass: 'tile-F' };
    if (tile === 'J')  return { number: 'J', label: 'Joker',  colorClass: 'tile-J' };
    if (tile.length === 2 && tile[1] === 'B') return { number: tile[0], label: 'Bam',   colorClass: 'tile-B' };
    if (tile.length === 2 && tile[1] === 'D') return { number: tile[0], label: 'Dot',   colorClass: 'tile-D' };
    if (tile.length === 2 && tile[1] === 'C') return { number: tile[0], label: 'Crack', colorClass: 'tile-C' };
    return { number: tile, label: '', colorClass: '' };
}

function getTileSvgName(tile) {
    if (tile === 'J')  return 'joker.svg';
    if (tile === 'F')  return 'flower.svg';
    if (tile === 'N')  return 'north.svg';
    if (tile === 'E')  return 'east.svg';
    if (tile === 'W')  return 'west.svg';
    if (tile === 'S')  return 'south.svg';
    if (tile === 'WD') return 'white.svg';
    if (tile === 'GD') return 'green.svg';
    if (tile === 'RD') return 'red.svg';
    if (tile.length === 2) {
        const num = tile[0], suit = tile[1];
        if (suit === 'B') return num + 'bam.svg';
        if (suit === 'D') return num + 'dot.svg';
        if (suit === 'C') return num + 'crak.svg';
    }
    return null;
}

function makeTileEl(tile) {
    if (tileMode === 'svg') {
        const name = getTileSvgName(tile);
        if (name) {
            const wrap = document.createElement('div');
            wrap.className = 'trad-tile';
            const bg = document.createElement('img');
            bg.src = '/Mahjong/tiles/background/bone.svg';
            bg.alt = '';
            const face = document.createElement('img');
            face.src = '/Mahjong/tiles/traditional/' + name;
            face.alt = tile;
            wrap.appendChild(bg);
            wrap.appendChild(face);
            return wrap;
        }
    }
    return makeTextTileEl(tile);
}

function makeTextTileEl(tile) {
    const d = getTileDisplay(tile);
    const div = document.createElement('div');
    div.className = 'tile ' + d.colorClass;
    const numDiv = document.createElement('div');
    numDiv.className = 'tile-number';
    numDiv.textContent = d.number;
    const lblDiv = document.createElement('div');
    lblDiv.className = 'tile-label';
    lblDiv.textContent = d.label;
    div.appendChild(numDiv);
    div.appendChild(lblDiv);
    return div;
}

// ── Scenario generation ───────────────────────────────────────────────────────

const SUITS  = ['B', 'C', 'D'];
const WINDS  = ['N', 'E', 'W', 'S'];
const DRAGONS = ['GD', 'RD', 'WD'];

function pick(arr)           { return arr[Math.floor(Math.random() * arr.length)]; }
function pickSuit()          { return pick(SUITS); }
function pickNum(min, max)   { return min + Math.floor(Math.random() * (max - min + 1)); }

// Any tile usable as a pung/kong anchor (numbers, winds, dragons, flowers)
function pickPungTile() {
    const r = Math.random();
    if (r < 0.60) return pickNum(1, 9) + pickSuit();
    if (r < 0.80) return pick(WINDS);
    if (r < 0.95) return pick(DRAGONS);
    return 'F';
}

function tileName(tile) {
    const map = { J:'Joker', F:'Flower', N:'North Wind', E:'East Wind',
                  W:'West Wind', S:'South Wind',
                  GD:'Green Dragon', RD:'Red Dragon', WD:'White Dragon (Soap)' };
    if (map[tile]) return map[tile];
    const suits = { B:'Bam', C:'Crack', D:'Dot' };
    return tile[0] + ' ' + suits[tile[1]];
}

// Replace `count` randomly chosen positions with 'J', keeping at least 1 natural tile.
function insertJokers(tiles, count) {
    const result = [...tiles];
    const indices = result.map((_,i) => i);
    for (let i = indices.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    indices.slice(0, Math.min(count, result.length - 1)).forEach(i => result[i] = 'J');
    return result;
}

// Joker count distribution: 25% none, 50% one, 12.5% two, 12.5% three
function pickJokerCount(max) {
    const r = Math.random();
    if (r < 0.25) return 0;
    if (r < 0.75) return Math.min(1, max);
    if (r < 0.875) return Math.min(2, max);
    return Math.min(3, max);
}

// ── Group generators ──────────────────────────────────────────────────────────

// ── Rule phrase pools ─────────────────────────────────────────────────────────

const RULES = {
    seq:        [ 'Jokers can never be used in a sequence.',
                  'Jokers can only be used in groups of identical tiles.' ],
    pair:       [ 'Jokers cannot be used in a pair.',
                  'Pairs must be natural tiles only.' ],
    legalJoker: [ 'Jokers CAN be used in groups of identical tiles.',
                  'This is a group of identical tiles — jokers are valid.' ],
    clean:      'No jokers here — nothing to judge!'
};

function seqRule()        { return pick(RULES.seq); }
function pairRule()       { return pick(RULES.pair); }
function legalJokerRule() { return pick(RULES.legalJoker); }

// ── Group generators ──────────────────────────────────────────────────────────

function genPair(withJoker) {
    const tile = pickPungTile();
    if (withJoker) {
        const tiles = Math.random() < 0.5 ? [tile, 'J', null, null] : ['J', tile, null, null];
        return { tiles, legal: false, verdict: '✗ Illegal!', rule: pairRule() };
    }
    return { tiles: [tile, tile, null, null], legal: true, verdict: '✓ Legal!', rule: RULES.clean };
}

function genPung(jokerCount) {
    const tile = pickPungTile();
    const tiles = insertJokers([tile, tile, tile], jokerCount);
    return { tiles: [...tiles, null], legal: true,
      verdict: '✓ Legal!',
      rule: jokerCount === 0 ? RULES.clean : legalJokerRule() };
}

function genKong(jokerCount) {
    const tile = pickPungTile();
    const tiles = insertJokers([tile, tile, tile, tile], jokerCount);
    return { tiles, legal: true,
      verdict: jokerCount === 3 ? '✓ Legal — but tricky!' : '✓ Legal!',
      rule: jokerCount === 0 ? RULES.clean : legalJokerRule() };
}

function genNews(jokerCount) {
    const base = ['N', 'E', 'W', 'S'];
    if (jokerCount === 0) {
        return { tiles: [...base], legal: true, verdict: '✓ Legal!', rule: RULES.clean };
    }
    return { tiles: insertJokers(base, jokerCount), legal: false, verdict: '✗ Illegal!', rule: seqRule() };
}

function genRun(size, jokerCount) {
    const suit  = pickSuit();
    const start = pickNum(1, 10 - size);
    const base  = Array.from({length: size}, (_, i) => (start + i) + suit);
    if (jokerCount === 0) {
        return { tiles: size === 3 ? [...base, null] : base, legal: true, verdict: '✓ Legal!', rule: RULES.clean };
    }
    const withJ = insertJokers(base, jokerCount);
    return { tiles: size === 3 ? [...withJ, null] : withJ, legal: false, verdict: '✗ Illegal!', rule: seqRule() };
}

function genOdds(size, jokerCount) {
    const starts = size === 3 ? [1, 3, 5] : [1, 3];
    const start  = pick(starts);
    const suit   = pickSuit();
    const base   = Array.from({length: size}, (_, i) => (start + i * 2) + suit);
    if (jokerCount === 0) {
        return { tiles: size === 3 ? [...base, null] : base, legal: true, verdict: '✓ Legal!', rule: RULES.clean };
    }
    const withJ = insertJokers(base, jokerCount);
    return { tiles: size === 3 ? [...withJ, null] : withJ, legal: false, verdict: '✗ Illegal!', rule: seqRule() };
}

function genEvens(size, jokerCount) {
    const starts = size === 3 ? [2, 4] : [2];
    const start  = pick(starts);
    const suit   = pickSuit();
    const base   = Array.from({length: size}, (_, i) => (start + i * 2) + suit);
    if (jokerCount === 0) {
        return { tiles: size === 3 ? [...base, null] : base, legal: true, verdict: '✓ Legal!', rule: RULES.clean };
    }
    const withJ = insertJokers(base, jokerCount);
    return { tiles: size === 3 ? [...withJ, null] : withJ, legal: false, verdict: '✗ Illegal!', rule: seqRule() };
}

function gen369(jokerCount) {
    const suit = pickSuit();
    const base = ['3'+suit, '6'+suit, '9'+suit];
    if (jokerCount === 0) {
        return { tiles: [...base, null], legal: true, verdict: '✓ Legal!', rule: RULES.clean };
    }
    return { tiles: [...insertJokers(base, jokerCount), null], legal: false, verdict: '✗ Illegal!', rule: seqRule() };
}

function gen2026(jokerCount) {
    const suit = pickSuit();
    const base = ['2'+suit, 'WD', '2'+suit, '6'+suit];
    if (jokerCount === 0) {
        return { tiles: [...base], legal: true, verdict: '✓ Legal!', rule: RULES.clean };
    }
    return { tiles: insertJokers(base, jokerCount), legal: false, verdict: '✗ Illegal!', rule: seqRule() };
}

// ── Main generator ────────────────────────────────────────────────────────────

function generateScenario() {
    if (Math.random() < 0.5) {
        // ── Legal 50% ──
        // Equal weight across: pair, pung, kong, clean sequence
        const type = pick(['pair', 'pung', 'kong', 'seq_clean']);
        switch (type) {
            case 'pair':      return genPair(false);
            case 'pung':      return genPung(pickJokerCount(2));
            case 'kong':      return genKong(pickJokerCount(3));
            case 'seq_clean': return genSeq(pick(['news','run3','run4','odds3','odds4','evens3','evens4','369','2026']), 0);
        }
    } else {
        // ── Illegal 50% ── equally weighted across all illegal types
        const type = pick(['pair','news','run3','run4','odds3','odds4','evens3','evens4','369','2026']);
        if (type === 'pair') return genPair(true);
        // Sequences: 1 joker 70%, 2 jokers 30%
        const jokers = Math.random() < 0.7 ? 1 : 2;
        return genSeq(type, jokers);
    }
}

function genSeq(type, jokerCount) {
    switch (type) {
        case 'news':   return genNews(jokerCount);
        case 'run3':   return genRun(3, jokerCount);
        case 'run4':   return genRun(4, jokerCount);
        case 'odds3':  return genOdds(3, jokerCount);
        case 'odds4':  return genOdds(4, jokerCount);
        case 'evens3': return genEvens(3, jokerCount);
        case 'evens4': return genEvens(4, jokerCount);
        case '369':    return gen369(jokerCount);
        case '2026':   return gen2026(jokerCount);
    }
}

// ── Spin pool ─────────────────────────────────────────────────────────────────

const SPIN_POOL = [
    '1B','2B','3B','4B','5B','6B','7B','8B','9B',
    '1C','2C','3C','4C','5C','6C','7C','8C','9C',
    '1D','2D','3D','4D','5D','6D','7D','8D','9D',
    'N','E','W','S','GD','RD','WD','F','J'
];

function randomTile() {
    return SPIN_POOL[Math.floor(Math.random() * SPIN_POOL.length)];
}

// ── Game constants ────────────────────────────────────────────────────────────

const SPIN_COST   = 5;
const START_COINS = 100;
const GOAL        = 500;

// ── Game state ────────────────────────────────────────────────────────────────

let gameState       = 'idle'; // 'idle' | 'spinning' | 'landed'
let currentScenario = null;
let bank            = START_COINS;
const spinIntervals = [null, null, null, null];

function groupValue(tiles) {
    const count = tiles.filter(t => t !== null).length;
    if (count === 2) return 15;
    if (count === 3) return 25;
    return 40;
}

function updateCoinDisplay() {
    const cd = document.getElementById('coinDisplay');
    if (cd) cd.textContent = '🪙 ' + bank;
    const ba = document.getElementById('bankAmount');
    if (ba) ba.textContent = bank;
}

function showFeedback(text, style) {
    // style: 'earned' | 'penalty' | 'missed'
    const fb    = document.getElementById('feedback');
    const badge = document.getElementById('feedbackBadge');
    badge.className = 'feedback-badge ' + style;
    badge.textContent = text;
    fb.className = 'feedback visible';
}

function hideFeedback() {
    document.getElementById('feedback').className = 'feedback';
}

function setReelTile(idx, tile) {
    const win = document.getElementById('reel' + idx);
    win.innerHTML = '';
    if (!tile) { win.classList.add('blank'); return; }
    win.classList.remove('blank');
    win.appendChild(makeTileEl(tile));
}

function renderScenarioTiles(scenario) {
    for (let i = 0; i < 4; i++) setReelTile(i, scenario.tiles[i]);
}

function resetReels() {
    for (let i = 0; i < 4; i++) {
        const win = document.getElementById('reel' + i);
        win.innerHTML = '';
        win.classList.remove('bounce');
        win.classList.add('blank');
        document.getElementById('light' + i).classList.remove('lit');
    }
}

// ── Spin animation ────────────────────────────────────────────────────────────

function triggerSpin(awManMsg) {
    gameState = 'spinning';
    document.getElementById('btnBank').disabled     = true;
    document.getElementById('btnSpinAway').disabled = true;
    resetReels();

    if (awManMsg) showFeedback(awManMsg, 'missed');
    else hideFeedback();

    currentScenario = generateScenario();

    for (let i = 0; i < 4; i++) {
        const win = document.getElementById('reel' + i);
        win.classList.remove('blank');
        spinIntervals[i] = setInterval(() => {
            win.innerHTML = '';
            win.appendChild(makeTileEl(randomTile()));
        }, 80);
    }

    const stopDelays = [1100, 1550, 2000, 2450];
    stopDelays.forEach((delay, i) => {
        setTimeout(() => stopReel(i), delay);
    });
}

function stopReel(i) {
    clearInterval(spinIntervals[i]);
    setReelTile(i, currentScenario.tiles[i]);
    if (currentScenario.tiles[i]) document.getElementById('light' + i).classList.add('lit');

    const win = document.getElementById('reel' + i);
    win.classList.remove('bounce');
    void win.offsetWidth;
    win.classList.add('bounce');

    if (i === 3) {
        setTimeout(() => {
            gameState = 'landed';
            hideFeedback();
            document.getElementById('btnBank').disabled     = false;
            document.getElementById('btnSpinAway').disabled = false;
        }, 300);
    }
}

// ── Player actions ────────────────────────────────────────────────────────────

function doBank() {
    if (gameState !== 'landed') return;
    document.getElementById('btnBank').disabled = true;

    if (currentScenario.legal) {
        const val = groupValue(currentScenario.tiles);
        bank += val;
        updateCoinDisplay();
        showFeedback('✓ Banked ' + val + ' coins!', 'earned');
        if (checkWin()) return;
    } else {
        const lost = Math.floor(bank * 0.5);
        bank = bank - lost;
        updateCoinDisplay();
        showFeedback('Yow! That illegal group cost you ' + lost + ' coins!', 'penalty');
        if (checkBankrupt()) return;
    }

    gameState = 'idle';
    // Bank It stays disabled until next spin lands; Spin stays enabled
}

function doSpin() {
    if (gameState !== 'landed' && gameState !== 'idle') return;
    const wasLegal = gameState === 'landed' ? currentScenario.legal : false;
    const wasWorth = gameState === 'landed' ? groupValue(currentScenario.tiles) : 0;

    bank -= SPIN_COST;
    updateCoinDisplay();

    if (checkBankrupt()) return;

    const awMan = wasLegal
        ? 'Aw man! That was a legal group worth ' + wasWorth + ' coins!'
        : null;

    triggerSpin(awMan);
}

// ── End state checks ──────────────────────────────────────────────────────────

function checkWin() {
    if (bank >= GOAL) {
        document.getElementById('endStars').textContent = '🌟🃏🌟';
        document.getElementById('endTitle').className = 'end-title win';
        document.getElementById('endTitle').textContent = 'JACKPOT!';
        document.getElementById('endSubtitle').textContent =
            'You reached ' + bank + ' coins. You\'ve got the joker rule down!';
        document.getElementById('endOverlay').className = 'end-overlay visible';
        return true;
    }
    return false;
}

function checkBankrupt() {
    if (bank < SPIN_COST) {
        document.getElementById('endStars').textContent = '🃏';
        document.getElementById('endTitle').className = 'end-title lose';
        document.getElementById('endTitle').textContent = 'Bankrupt!';
        document.getElementById('endSubtitle').textContent =
            'Better luck next time — you finished with ' + bank + ' coins.';
        document.getElementById('endOverlay').className = 'end-overlay visible';
        return true;
    }
    return false;
}

// ── Init / restart ────────────────────────────────────────────────────────────

function startGame() {
    bank = START_COINS;
    gameState = 'idle';
    updateCoinDisplay();
    hideFeedback();
    resetReels();
    document.getElementById('btnBank').disabled     = true;
    document.getElementById('btnSpinAway').disabled = false;
    document.getElementById('endOverlay').className = 'end-overlay';
}

window.addEventListener('load', () => startGame());
</script>
